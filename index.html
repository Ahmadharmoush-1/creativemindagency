<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Creative Mind — Mind Made Visible</title>
    <meta
      name="description"
      content="Creative Mind is a marketing and creative agency. Brands, campaigns and digital systems designed to move your business forward."
    />
    <meta name="theme-color" content="#051746" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Creative Mind" />
    <meta property="og:title" content="Creative Mind — Mind Made Visible" />
    <meta
      property="og:description"
      content="We don't decorate brands. We engineer them. Brands, campaigns, systems, funnels, automations, digital experiences and growth engines."
    />
    <meta property="og:image" content="/media/hero-poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Creative Mind",
        "slogan": "Mind Made Visible",
        "description": "Marketing and creative agency building brands, campaigns, systems, funnels, automations, digital experiences and growth engines."
      }
    </script>
    <script>
      // Set language, direction and motion preference before first paint to avoid layout shift.
      ;(function () {
        var d = document.documentElement
        var l = 'en'
        try {
          l = localStorage.getItem('cm-lang')
          if (l === 'ar') {
            d.lang = 'ar'
            d.dir = 'rtl'
          }
        } catch (e) {}
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('js-motion')
        // Hero poster: preload only the copy this screen and language will show
        // (Arabic uses the mirrored posters). Same choice as heroPoster() in src/lib/heroMedia.ts.
        var portrait = window.matchMedia('(max-width: 1023px) and (orientation: portrait)').matches
        var p = document.createElement('link')
        p.rel = 'preload'
        p.as = 'image'
        p.setAttribute('fetchpriority', 'high')
        p.href = '/media/hero-poster' + (portrait ? '-mobile' : '') + (l === 'ar' ? '-ar' : '') + '.webp'
        document.head.appendChild(p)
      })()
    </script>
  </head>
  <body>
    <form
  name="contact"
  method="POST"
  data-netlify="true"
  hidden
>
  <input type="text" name="name" />
  <input type="text" name="company" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <textarea name="message"></textarea>
  <input type="text" name="categories" />
  <input type="text" name="lang" />
</form>
    <div id="root"></div>
    <noscript>Creative Mind — Mind Made Visible. This site needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
